name: CI Frontend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=frontend

      - name: Tests
        run: npm test --workspace=frontend

      - name: Build
        run: npm run build --workspace=frontend
